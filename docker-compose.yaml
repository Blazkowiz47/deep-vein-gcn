version: '3'
services:
  deepvein:
    container_name: deepvein
    ipc: host
    restart: unless-stopped
    stdin_open: true
    tty: true
    build:
      dockerfile: ./Dockerfile
    volumes:
      - .:/root/code
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu
                - utility
                - compute

