batch_size: 8
epochs: 50
device: "cuda"
width: 147
height: 147
lr: 0.0001
validate_after_epochs: 1
seed: 2025
num_workers: 8

# dataset seed
stat_seed: 0

# Hyper parameters for loss funtion
loss: "crossentropy"
num_classes: 301 # For training on FV-300
freeze_centroids: 30
lmbda:  0.01
fine_tune: False

# Hyper parameters for model
model: "lgfin"
indims: 3
dwconv0:
  indims: 3
  outdims: 64

block1:
  indims: 64
  outdims: 128
  height: 73
  width: 73

block2:
  indims: 128
  outdims: 256
  height: 36
  width: 36

block3:
  indims: 256
  outdims: 512
  height: 18
  width: 18

outdims: 512
hdims: 1024



